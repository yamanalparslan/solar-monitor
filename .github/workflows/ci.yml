name: Solar Monitor CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    # Dockerfile python:3.11-slim kullaniyor; CI ayni surumde kossun ki
    # testlerin gectigi ortam uretimle ayni olsun.
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        
    - name: Run Tests
      # Örnek test komutu, veritabanı boş oluşturulup testler çalıştırılır.
      run: |
        python -m pytest test_*.py -v --cov=.
